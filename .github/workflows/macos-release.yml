# 功能：手动构建兼容 Apple Silicon 和 Intel 的 macOS 通用包，自动准备标签及 Release 草稿。
# 时间：2026-10-24
# 作者：lq
name: macOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "可选：已有版本标签；留空按所选分支版本自动创建"
        required: false
        default: ""
        type: string

permissions:
  contents: write

# 功能：同一标签串行发布，避免并发上传相同文件；时间：2026-10-24；作者：lq。
concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # 功能：跨平台串行准备标签和草稿，构建任务可并行且固定使用同一源码；时间：2026-10-24；作者：lq。
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: prepare-mini-office-release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.prepare.outputs.APP_VERSION }}
      tag: ${{ steps.prepare.outputs.RELEASE_TAG }}
      sha: ${{ steps.prepare.outputs.SOURCE_SHA }}
    steps:
      # 功能：使用所选分支中的最新发布准备脚本；时间：2026-10-24；作者：lq。
      - name: Checkout selected source
        uses: actions/checkout@v6
      # 功能：自动补建标签和草稿，并输出实际发布源码；时间：2026-10-24；作者：lq。
      - name: Prepare release automatically
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: node .github/scripts/prepare-release.cjs

  build-macos:
    needs: prepare-release
    env:
      APP_VERSION: ${{ needs.prepare-release.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      # 功能：使用准备阶段确定的不可变提交，避免构建期间分支更新；时间：2026-10-24；作者：lq。
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      # 功能：安装项目 packageManager 指定的 pnpm；时间：2026-10-24；作者：lq。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 功能：安装与 Windows 流程一致的 Node.js 并缓存依赖；时间：2026-10-24；作者：lq。
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      # 功能：为通用应用安装 ARM64 和 x64 两套 Rust 编译目标；时间：2026-10-24；作者：lq。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # 功能：使用发布标签中的锁文件安装依赖；时间：2026-10-24；作者：lq。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 功能：无需 Apple 证书，使用临时签名生成通用应用及 DMG；时间：2026-10-24；作者：lq。
      - name: Build macOS universal
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri:build --target universal-apple-darwin --bundles app,dmg --ci

      # 功能：保留应用结构与资源并生成架构独立的校验清单；时间：2026-10-24；作者：lq。
      - name: Prepare downloads
        run: |
          set -euo pipefail
          bundle_dir="target/universal-apple-darwin/release/bundle"
          asset_prefix="Mini-Office_${APP_VERSION}_macos-universal"
          mkdir -p release-assets
          shopt -s nullglob
          installers=("$bundle_dir"/dmg/*.dmg)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "Expected exactly one DMG installer." >&2
            exit 1
          fi
          test -d "$bundle_dir/macos/Mini Office.app"
          lipo -verify_arch arm64 x86_64 "$bundle_dir/macos/Mini Office.app/Contents/MacOS/mini-office-desktop"
          cp "${installers[0]}" "release-assets/${asset_prefix}.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            "$bundle_dir/macos/Mini Office.app" "release-assets/${asset_prefix}.zip"
          cd release-assets
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS-macos-universal.txt
          shasum -a 256 -c SHA256SUMS-macos-universal.txt

      # 功能：保留可下载的构建产物，Release 上传失败时仍可获取；时间：2026-10-24；作者：lq。
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Office_${{ env.APP_VERSION }}_macos-universal
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      # 功能：上传到已有 Release，同名文件报错以保留已有下载；时间：2026-10-24；作者：lq。
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" release-assets/*
